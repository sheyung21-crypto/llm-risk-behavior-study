[project]
name = "llm-risk-behavior-study"
version = "0.1.0"
description = "Reproducible source and data audit for the Preference Survey Module replication package"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.2",
  "pandas==3.0.5",
  "pyarrow==25.0.1",
  "pyreadstat==1.3.6",
  "PyYAML==6.0.3",
  "scikit-learn==1.9.0",
  "scipy==1.18.1",
  "statsmodels==0.15.0",
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "sensitive_research_data: requires real DTA or locked outcome artifacts and must never run in Goal 5 preflight",
]
