    benchmark_0_exclusions: [R29, R35, R48, R50]
  k_stability:
    primary_K_remains: 1
    participants: 30
    repeats: 5
    lists: 2
    estimator: ICC_1_1_one_way_random_effects
    candidate_average_reliability_K: [1, 3, 5]
    bootstrap_unit: participant_five_repeat_vector
    hard_threshold: false
  ridge_reference:
    role: supervised_contextual_reference
    features: fixed_C1_46_numeric_questionnaire_responses
    target: x_risk_av
    objective: mean_squared_prediction_error
    outer_folds: 5
    inner_folds: 5
    scaling: training_fold_only
    alpha_grid:
      scale: log10
      minimum: 0.0001
      maximum: 10000
      count: 33
  published_R2_R3_context:
