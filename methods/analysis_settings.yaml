goal8_confirmatory_analysis:
  authorization_status: approved
  outcome_blind_phase_required_before_unlock: true
  outcome_unlock_file: data/locked/confirmatory_outcomes.parquet
  primary_condition: C1
  primary_metric: spearman_C1_score_with_x_risk_av
  inference:
    resamples: 10000
    confidence_interval: percentile_95
    permutation_p_value: two_sided_plus_one
    participant_vector_resampling: true
  sensitivity_conditions: [C2, C3]
  paired_absolute_error_tests:
    C2: absolute_error_C2_minus_absolute_error_C1
    C3: absolute_error_C1_minus_absolute_error_C3
